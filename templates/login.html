<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — QRMeet</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d14; --surface: #13131f; --surface2: #1a1a2e;
      --border: #2a2a42; --accent: #6c63ff; --accent2: #ff6584;
      --text: #e8e8f0; --text-muted: #7a7a9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      top: -200px; right: -100px; pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,101,132,0.08) 0%, transparent 70%);
      bottom: -100px; left: -50px; pointer-events: none;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 400px;
      position: relative; z-index: 1;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      width: 56px; height: 56px; background: var(--accent);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; font-family: 'Syne', sans-serif;
      font-size: 1.4rem; font-weight: 800; color: #fff;
    }
    .logo h1 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
    .logo p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 12px 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      width: 100%; padding: 13px; background: var(--accent);
      border: none; border-radius: 8px; color: #fff;
      font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s; margin-top: 8px;
    }
    .btn:hover { background: #5a52e0; }
    .alert {
      padding: 10px 14px; border-radius: 8px;
      background: rgba(255,101,132,0.1); border: 1px solid rgba(255,101,132,0.2);
      color: var(--accent2); font-size: 0.85rem; margin-bottom: 18px;
    }
    @media (max-width: 480px) {
      .login-box { padding: 32px 20px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">QR</div>
      <h1>QRMeet</h1>
      <p>Gestion des présences par QR Code</p>
    </div>
    {% for cat, msg in get_flashed_messages(with_categories=True) %}
    <div class="alert">{{ msg }}</div>
    {% endfor %}
    <form method="POST">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Se connecter</button>
    </form>
  </div>
</body>
</html>
